[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-excel-note"
version = "4.0.0"
description = "Create and update Excel proxy Markdown notes with optional AI context."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tuckn" }]
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "tkn-genai-bridge @ https://github.com/tuckn/tkn_genai_bridge/archive/9cf534e47159901c3bb05bb802695fad746cc338.zip",
  "pywin32>=308; sys_platform == 'win32'",
  "pypdfium2>=4.30; sys_platform == 'win32'",
  "Pillow>=11.0; sys_platform == 'win32'",
]

[project.scripts]
tkn-excel-note = "excel_catalog_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "types-PyYAML>=6.0.12.20250516",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/excel_catalog_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["excel_catalog_pipeline"]
